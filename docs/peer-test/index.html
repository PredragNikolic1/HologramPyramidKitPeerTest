<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peer Test</title>
<!--
  Step 1 of the remote-sensor feature: a plain HTML test (no Unity) that checks whether
  browsers on the same Wi-Fi can connect directly to each other with WebRTC (PeerJS).

  Open without parameters  -> host mode (shows a QR code).
  Open with ?join=<hostId> -> remote mode (what the QR code links to).

  The message format and limits here are the ones the Unity version will use, so keep them in sync.
  Libraries are stored in lib/ at a fixed version instead of being loaded from a CDN.
-->
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5d6470; --line: #dde1e7;
    --accent: #2f6fde; --accent-text: #ffffff; --ok: #1f8a4c; --warn: #b26a00; --bad: #c0352b;
    --flash: #fff1b8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b21; --text: #e8eaee; --muted: #9aa2ae; --line: #2a2f38;
      --accent: #5b8ff0; --accent-text: #0f1115; --ok: #4cc27f; --warn: #e3a33b; --bad: #ef6b60;
      --flash: #4a3f12;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .big { flex: 1 1 0; min-width: 90px; padding: 22px 10px; font-size: 18px; font-weight: 600; }
  input { font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--bg); color: var(--text); min-width: 0; flex: 1; }
  #status { font-weight: 600; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  #qr { display: block; margin: 8px auto; width: 240px; height: 240px; image-rendering: pixelated;
        background: #fff; border-radius: 6px; }
  .link { word-break: break-all; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  tr.flash td { background: var(--flash); }
  #log { font: 12px/1.4 ui-monospace, Consolas, monospace; max-height: 220px; overflow: auto;
         white-space: pre-wrap; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Peer test</h1>
  <div class="card">
    <div id="status">Not connected</div>
    <div id="hint" class="muted"></div>
  </div>

  <!-- Host -->
  <section id="hostView" hidden>
    <div class="card">
      <button id="hostStart" class="primary">Start hosting</button>
      <div id="hostInfo" hidden>
        <canvas id="qr" width="240" height="240" aria-label="QR code with the join link"></canvas>
        <div class="muted">Scan with the phone camera, or open:</div>
        <div class="row"><a id="joinLink" class="link" target="_blank" rel="noopener"></a></div>
        <div class="row" style="margin-top:8px"><button id="copyLink">Copy link</button></div>
      </div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <strong>Remotes</strong><span id="remoteCount" class="muted">0 / 4</span>
      </div>
      <table>
        <thead><tr><th>Name</th><th>Path</th><th>RTT</th><th>Msgs</th><th>Last event</th></tr></thead>
        <tbody id="remoteRows"></tbody>
      </table>
    </div>
  </section>

  <!-- Remote -->
  <section id="remoteView" hidden>
    <div class="card">
      <div class="row">
        <input id="remoteName" maxlength="24" aria-label="Device name">
        <button id="remoteConnect" class="primary">Connect</button>
      </div>
      <div class="muted" style="margin-top:8px">
        Path: <span id="remotePath">-</span> &middot; RTT: <span id="remoteRtt">-</span>
      </div>
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:8px">Simulated sensor events (no mic in this test):</div>
      <div class="row">
        <button class="big sensor" data-event="clap" disabled>Clap</button>
        <button class="big sensor" data-event="blow" disabled>Blow</button>
        <button class="big sensor" data-event="light" disabled>Light</button>
      </div>
    </div>
  </section>

  <div class="card">
    <strong>Log</strong>
    <pre id="log"></pre>
  </div>
</main>

<script src="lib/peerjs-1.5.4.min.js"></script>
<script src="lib/qrcode-generator-1.4.4.js"></script>
<script>
(function () {
  "use strict";

  // ---- Shared constants (keep in sync with the Unity version) ----
  var PROTOCOL_VERSION = 1;
  var MAX_REMOTES = 4;
  var MAX_MESSAGE_CHARS = 512;
  var MAX_MESSAGES_PER_SECOND = 20;
  var MAX_NAME_CHARS = 24;
  var PING_INTERVAL_MS = 2000;
  var PEER_TIMEOUT_MS = 6000;
  var CONNECT_TIMEOUT_MS = 10000;
  var STATS_INTERVAL_MS = 3000;
  var FULL_CLOSE_DELAY_MS = 500;
  var FLASH_MS = 600;
  var HOST_ID_PREFIX = "hpk-";
  var HOST_ID_RANDOM_CHARS = 16;
  var HOST_ID_ALPHABET = "abcdefghijkmnpqrstuvwxyz23456789"; // 32 chars, no look-alikes (l, o, 0, 1)

  // STUN only. PeerJS's defaults also include PeerJS's public TURN relay, which would silently
  // send our data through their server when a direct connection fails. We want to see that failure.
  var PEER_OPTIONS = {
    debug: 1,
    config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }
  };
  var CONNECT_OPTIONS = { reliable: true, serialization: "raw" };

  var SENSOR_EVENTS = ["clap", "blow", "light"];

  // ---- Small helpers ----
  function $(id) { return document.getElementById(id); }

  function log(text) {
    var line = new Date().toLocaleTimeString() + "  " + text + "\n";
    var el = $("log");
    el.textContent = line + el.textContent;
  }

  function setStatus(text, kind, hint) {
    var el = $("status");
    el.textContent = text;
    el.className = kind || "";
    $("hint").textContent = hint || "";
  }

  function randomHostId() {
    var bytes = new Uint8Array(HOST_ID_RANDOM_CHARS);
    crypto.getRandomValues(bytes);
    var id = HOST_ID_PREFIX;
    for (var i = 0; i < bytes.length; i++) {
      id += HOST_ID_ALPHABET[bytes[i] & 31]; // alphabet has exactly 32 chars, so no bias
    }
    return id;
  }

  function send(conn, message) {
    message.v = PROTOCOL_VERSION;
    conn.send(JSON.stringify(message));
  }

  // Returns a checked message object, or null. Never trust what arrives over the network.
  function parseMessage(data) {
    if (typeof data !== "string" || data.length > MAX_MESSAGE_CHARS) return null;
    var msg;
    try { msg = JSON.parse(data); } catch (e) { return null; }
    if (!msg || typeof msg !== "object" || msg.v !== PROTOCOL_VERSION || typeof msg.type !== "string") return null;

    switch (msg.type) {
      case "hello":
        return typeof msg.name === "string"
          ? { type: "hello", name: msg.name.trim().slice(0, MAX_NAME_CHARS) || "Remote" } : null;
      case "sensor":
        if (typeof msg.seq !== "number") return null;
        var out = { type: "sensor", seq: msg.seq };
        for (var i = 0; i < SENSOR_EVENTS.length; i++) {
          var key = SENSOR_EVENTS[i];
          if (typeof msg[key] !== "boolean") return null;
          out[key] = msg[key];
        }
        return out;
      case "ping":
        return typeof msg.t === "number"
          ? { type: "ping", t: msg.t, rtt: typeof msg.rtt === "number" ? msg.rtt : null } : null;
      case "pong":
        return typeof msg.t === "number" ? { type: "pong", t: msg.t } : null;
      case "welcome":
        return { type: "welcome" };
      case "full":
        return { type: "full" };
      default:
        return null;
    }
  }

  // Reads which network path WebRTC actually chose for this connection.
  function readPath(conn, callback) {
    var pc = conn.peerConnection;
    if (!pc || !pc.getStats) { callback("unknown"); return; }
    pc.getStats().then(function (stats) {
      var pair = null, reports = {};
      stats.forEach(function (r) { reports[r.id] = r; });
      stats.forEach(function (r) {
        if (r.type === "transport" && r.selectedCandidatePairId) pair = reports[r.selectedCandidatePairId];
      });
      if (!pair) {
        stats.forEach(function (r) {
          if (r.type === "candidate-pair" && r.state === "succeeded" && (r.nominated || r.selected)) pair = r;
        });
      }
      if (!pair) { callback("unknown"); return; }
      var local = reports[pair.localCandidateId], remote = reports[pair.remoteCandidateId];
      var lt = local && local.candidateType, rt = remote && remote.candidateType;
      if (lt === "relay" || rt === "relay") callback("relay (not local!)");
      else if (lt === "host" && rt === "host") callback("direct (LAN)");
      else callback("direct via router (" + lt + "/" + rt + ")");
    }).catch(function () { callback("unknown"); });
  }

  function describePeerError(err) {
    switch (err.type) {
      case "peer-unavailable": return "Host not found. Is the host page still open? Scan the QR code again.";
      case "network":          return "No connection to the signaling server. Check the internet connection.";
      case "server-error":     return "The PeerJS signaling server had a problem. Try again in a moment.";
      case "unavailable-id":   return "This host ID is taken. Reload the page.";
      case "browser-incompatible": return "This browser does not support WebRTC.";
      case "disconnected":     return "Lost the signaling server. Existing connections may still work.";
      default:                 return err.message || String(err.type);
    }
  }

  function requestWakeLock() {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request("screen").then(function () {
      log("Screen wake lock on.");
    }).catch(function (e) { log("Wake lock not available: " + e.message); });
  }

  // =========================================================================
  // Host
  // =========================================================================
  function startHost() {
    $("title").textContent = "Peer test - Host";
    $("hostView").hidden = false;

    var remotes = {}; // peerId -> { conn, name, msgs, dropped, lastSeen, rtt, path, lastEvent, windowStart, windowCount, row }

    function remoteCount() { return Object.keys(remotes).length; }

    function render() {
      $("remoteCount").textContent = remoteCount() + " / " + MAX_REMOTES;
      var body = $("remoteRows");
      Object.keys(remotes).forEach(function (id) {
        var r = remotes[id];
        if (!r.row) {
          r.row = document.createElement("tr");
          for (var i = 0; i < 5; i++) r.row.appendChild(document.createElement("td"));
          body.appendChild(r.row);
        }
        var cells = r.row.children;
        cells[0].textContent = r.name;
        cells[1].textContent = r.path;
        cells[2].textContent = r.rtt == null ? "-" : Math.round(r.rtt) + " ms";
        cells[3].textContent = r.msgs + (r.dropped ? " (" + r.dropped + " dropped)" : "");
        cells[4].textContent = r.lastEvent;
      });
    }

    function removeRemote(id, reason) {
      var r = remotes[id];
      if (!r) return;
      if (r.row) r.row.remove();
      delete remotes[id];
      log("Remote left: " + r.name + " (" + reason + ")");
      render();
    }

    function flash(r) {
      r.row.classList.add("flash");
      setTimeout(function () { if (r.row) r.row.classList.remove("flash"); }, FLASH_MS);
    }

    function isRateLimited(r) {
      var now = Date.now();
      if (now - r.windowStart >= 1000) { r.windowStart = now; r.windowCount = 0; }
      r.windowCount++;
      return r.windowCount > MAX_MESSAGES_PER_SECOND;
    }

    function onMessage(id, data) {
      var r = remotes[id];
      if (!r) return;
      if (isRateLimited(r)) { r.dropped++; render(); return; }
      var msg = parseMessage(data);
      if (!msg) { r.dropped++; log("Ignored invalid message from " + r.name); render(); return; }

      r.msgs++;
      r.lastSeen = Date.now();
      switch (msg.type) {
        case "hello":
          log("Hello from " + msg.name + " (was " + r.name + ")");
          r.name = msg.name;
          break;
        case "ping":
          if (msg.rtt != null) r.rtt = msg.rtt;
          send(r.conn, { type: "pong", t: msg.t });
          break;
        case "sensor":
          var fired = SENSOR_EVENTS.filter(function (k) { return msg[k]; });
          if (fired.length) {
            r.lastEvent = fired.join("+") + " #" + msg.seq;
            log(r.name + ": " + r.lastEvent);
            render();
            flash(r);
          }
          break;
      }
      render();
    }

    function onConnection(conn) {
      if (remoteCount() >= MAX_REMOTES) {
        log("Refused a remote: already " + MAX_REMOTES + " connected.");
        conn.on("open", function () {
          send(conn, { type: "full" });
          setTimeout(function () { conn.close(); }, FULL_CLOSE_DELAY_MS);
        });
        return;
      }

      var id = conn.peer;
      var now = Date.now();
      remotes[id] = {
        conn: conn, name: "Remote " + (remoteCount() + 1), msgs: 0, dropped: 0, lastSeen: now,
        rtt: null, path: "connecting...", lastEvent: "-", windowStart: now, windowCount: 0, row: null
      };
      render();

      conn.on("open", function () {
        log("Remote connected: " + id);
        send(conn, { type: "welcome" });
        setTimeout(function () {
          readPath(conn, function (path) {
            if (!remotes[id]) return;
            remotes[id].path = path;
            log(remotes[id].name + " path: " + path);
            render();
          });
        }, 1000);
      });
      conn.on("data", function (data) { onMessage(id, data); });
      conn.on("close", function () { removeRemote(id, "closed"); });
      conn.on("error", function (e) { log("Connection error: " + e.message); removeRemote(id, "error"); });
    }

    $("hostStart").onclick = function () {
      $("hostStart").disabled = true;
      setStatus("Starting...", "", "Registering with the signaling server.");
      requestWakeLock();

      var peer = new Peer(randomHostId(), PEER_OPTIONS);

      peer.on("open", function (id) {
        var url = location.origin + location.pathname + "?join=" + encodeURIComponent(id);
        $("hostStart").hidden = true;
        $("hostInfo").hidden = false;
        $("joinLink").textContent = url;
        $("joinLink").href = url;
        drawQr(url);
        setStatus("Hosting", "ok", "Host ID " + id + ". Keep this tab open and in front.");
        log("Hosting as " + id);

        $("copyLink").onclick = function () {
          navigator.clipboard.writeText(url).then(function () { log("Link copied."); },
            function () { log("Copy failed, select the link by hand."); });
        };
      });
      peer.on("connection", onConnection);
      peer.on("disconnected", function () {
        log("Lost the signaling server, reconnecting...");
        if (!peer.destroyed) peer.reconnect();
      });
      peer.on("error", function (err) {
        log("Error (" + err.type + "): " + describePeerError(err));
        if (err.type !== "disconnected" && err.type !== "peer-unavailable") {
          setStatus("Error", "bad", describePeerError(err));
          $("hostStart").disabled = false;
        }
      });

      // Drop remotes that stopped sending (tab closed without a clean close, phone locked, ...).
      setInterval(function () {
        var now = Date.now();
        Object.keys(remotes).forEach(function (id) {
          if (now - remotes[id].lastSeen > PEER_TIMEOUT_MS) {
            var conn = remotes[id].conn;
            removeRemote(id, "timed out"); // before close(): close() fires the "closed" handler
            conn.close();
          }
        });
      }, PING_INTERVAL_MS);
    };

    setStatus("Not hosting", "", "Tap Start hosting, then scan the QR code with other phones on the same Wi-Fi.");
  }

  function drawQr(text) {
    var qr = qrcode(0, "M"); // 0 = pick the smallest size that fits
    qr.addData(text);
    qr.make();
    var count = qr.getModuleCount();
    var quiet = 4; // white border the QR standard asks for
    var canvas = $("qr");
    var ctx = canvas.getContext("2d");
    var cell = Math.floor(canvas.width / (count + quiet * 2));
    var offset = Math.floor((canvas.width - cell * count) / 2);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000000";
    for (var r = 0; r < count; r++) {
      for (var c = 0; c < count; c++) {
        if (qr.isDark(r, c)) ctx.fillRect(offset + c * cell, offset + r * cell, cell, cell);
      }
    }
  }

  // =========================================================================
  // Remote
  // =========================================================================
  function startRemote(hostId) {
    $("title").textContent = "Peer test - Remote";
    $("remoteView").hidden = false;
    $("remoteName").value = "Phone " + (10 + Math.floor(Math.random() * 90));

    var peer = null, conn = null, seq = 0, rtt = null, lastPong = 0;
    var pingTimer = null, statsTimer = null, connectTimer = null;

    function setSensorsEnabled(on) {
      document.querySelectorAll(".sensor").forEach(function (b) { b.disabled = !on; });
    }

    function stopTimers() {
      clearInterval(pingTimer); clearInterval(statsTimer); clearTimeout(connectTimer);
    }

    function disconnected(text, kind, hint) {
      stopTimers();
      setSensorsEnabled(false);
      $("remoteConnect").disabled = false;
      $("remoteConnect").textContent = "Reconnect";
      setStatus(text, kind, hint);
      // Clear first: destroy() fires the connection's close handler, which must not run this again.
      var oldPeer = peer;
      peer = null;
      conn = null;
      if (oldPeer) oldPeer.destroy();
    }

    function connect() {
      $("remoteConnect").disabled = true;
      setStatus("Connecting...", "", "Host ID " + hostId);
      peer = new Peer(PEER_OPTIONS); // remotes get a random ID from the server

      connectTimer = setTimeout(function () {
        log("No connection after " + CONNECT_TIMEOUT_MS / 1000 + " s.");
        disconnected("Could not connect", "bad",
          "The devices could not reach each other directly. Guest Wi-Fi, eduroam and some routers block " +
          "device-to-device traffic. Try a phone hotspot.");
      }, CONNECT_TIMEOUT_MS);

      peer.on("open", function () {
        conn = peer.connect(hostId, CONNECT_OPTIONS);

        conn.on("open", function () {
          clearTimeout(connectTimer);
          lastPong = Date.now();
          send(conn, { type: "hello", name: $("remoteName").value });
          log("Connected to host.");

          pingTimer = setInterval(function () {
            if (Date.now() - lastPong > PEER_TIMEOUT_MS) {
              log("Host stopped answering.");
              disconnected("Host lost", "bad", "The host did not answer for " + PEER_TIMEOUT_MS / 1000 + " s.");
              return;
            }
            send(conn, { type: "ping", t: performance.now(), rtt: rtt });
          }, PING_INTERVAL_MS);

          function updatePath() {
            readPath(conn, function (path) { $("remotePath").textContent = path; });
          }
          setTimeout(updatePath, 1000);
          statsTimer = setInterval(updatePath, STATS_INTERVAL_MS);
        });

        conn.on("data", function (data) {
          var msg = parseMessage(data);
          if (!msg) { log("Ignored invalid message from host."); return; }
          switch (msg.type) {
            case "welcome":
              setStatus("Connected", "ok", "Tap a button. The host should flash this phone's row.");
              setSensorsEnabled(true);
              requestWakeLock();
              break;
            case "full":
              log("Host is full.");
              disconnected("Host is full", "warn", "The host already has " + MAX_REMOTES + " remotes.");
              break;
            case "pong":
              lastPong = Date.now();
              rtt = performance.now() - msg.t;
              $("remoteRtt").textContent = Math.round(rtt) + " ms";
              break;
          }
        });

        conn.on("close", function () {
          if (conn) disconnected("Disconnected", "warn", "The host closed the connection.");
        });
        conn.on("error", function (e) { log("Connection error: " + e.message); });
      });

      peer.on("error", function (err) {
        log("Error (" + err.type + "): " + describePeerError(err));
        if (err.type !== "disconnected") disconnected("Error", "bad", describePeerError(err));
      });
    }

    $("remoteConnect").onclick = connect;

    document.querySelectorAll(".sensor").forEach(function (button) {
      button.onclick = function () {
        if (!conn || !conn.open) return;
        var event = button.dataset.event;
        var msg = { type: "sensor", seq: ++seq };
        SENSOR_EVENTS.forEach(function (k) { msg[k] = (k === event); });
        send(conn, msg);
        log("Sent " + event + " #" + seq);
      };
    });

    setStatus("Ready", "", "Tap Connect to join host " + hostId + ".");
  }

  // ---- Start ----
  if (!window.Peer || !window.RTCPeerConnection) {
    setStatus("Not supported", "bad", "This browser does not support WebRTC or the library did not load.");
    return;
  }
  var joinId = new URLSearchParams(location.search).get("join");
  if (joinId) startRemote(joinId); else startHost();
})();
</script>
</body>
</html>
